name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Linters (HTMLHint y ESLint)
        run: |
          npm init -y
          npm install eslint htmlhint @eslint/js --save-dev

      - name: Linter 1 - HTMLHint (Páginas estáticas)
        run: npx htmlhint index.html

      - name: Linter 2 - ESLint (API)
        run: |
          echo 'import js from "@eslint/js"; export default [ js.configs.recommended, { rules: { "no-unused-vars": "warn", "no-undef": "off" } } ];' > eslint.config.mjs
          npx eslint api/app.js

      - name: Linter 3 - Hadolint (Dockerfiles)
        run: |
          docker run --rm -v "$PWD:/work" -w /work hadolint/hadolint hadolint api/Dockerfile web/Dockerfile db/Dockerfile

      - name: Armar el artefacto del sitio público
        run: |
          mkdir _site
          cp index.html _site/
          cp libro-de-visitas.js _site/
          cp style.css _site/
          cp Foto-Perfil-CV.jpeg _site/ || true 

      - name: Subir artefacto a GitHub
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Armar el sitio para las pruebas
        run: |
          mkdir -p _site
          cp index.html libro-de-visitas.js style.css Foto-Perfil-CV.jpeg _site/ || true

      - name: Ejecutar Vitest
        run: npm test

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para la imagen WEB
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/perfil-web
          tags: |
            type=sha,format=short

      - name: Construir y publicar imagen WEB
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}

      - name: Extraer metadatos para la imagen API
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/perfil-api
          tags: |
            type=sha,format=short

      - name: Construir y publicar imagen API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}